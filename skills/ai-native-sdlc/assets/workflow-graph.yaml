# <Project> — state on the AI-native SDLC loop graph

# Update this file as the project moves through gates. Automation may run the
# edges between nodes but never skip a gate. This file is the team's shared
# view of the pipeline: what is in flight, what is blocked at which gate.
#
# The intent lives in the tracker, not in the repo: a task on the board is an
# accepted intent (gate tracker_board). See the skill's references/trackers.md.
#
# The loop ends at implementation: the agent opens the MR/PR and stops. The
# team's review and merge close that node (code_owner_approve); deploy and
# monitoring are outside this workflow.
#
# status: not_started | in_progress | accepted | approved | in_review |
#         merged | pending | done

version: 1

nodes:
  intent:
    stage: plan
    artifact: tracker task (Linear / GitLab / GitHub)
    gate: tracker_board
    status: not_started
    done_status: accepted
  spec:
    stage: design
    artifact: spec.md
    gate: product_owner_approve
    status: not_started
    done_status: approved
  plan:
    stage: build
    artifact: plan.md
    gate: engineer_approve
    status: not_started
    done_status: approved
  implementation:
    stage: review
    artifact: code + tests -> MR/PR opened
    gate: code_owner_approve
    status: not_started
    done_status: merged

edges:
  - { from: intent, to: spec, trigger: acceptance }
  - { from: spec, to: plan, trigger: approval }
  - { from: plan, to: implementation, trigger: plan_accepted }
