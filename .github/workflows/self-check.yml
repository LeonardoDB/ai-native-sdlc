# Self-check: validate the skill/plugin bundle and its tests.

# The repo practices what it preaches: this workflow is the "verify before
# asking for review" rule applied to the repo itself.
name: self-check
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shell syntax (bash -n on every .sh)
        run: |
          set -e
          while IFS= read -r f; do bash -n "$f"; done < <(find . -name '*.sh' -not -path './node_modules/*')

      - name: Unit tests (tracker link, plan sync)
        run: python3 -m unittest discover -s tests -v

      - name: Integration tests (scaffold)
        run: bash tests/test_init.sh

      - name: Skill/plugin validation
        run: python3 skills/ai-native-sdlc/scripts/quick_validate.py skills/ai-native-sdlc
